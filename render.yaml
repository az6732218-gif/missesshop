services:
  - type: web
    name: misses-styles
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /var/data/shop.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: AHMED
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PATH
        sync: false
